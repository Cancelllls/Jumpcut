name: JumpCut Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JumpCut APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/jumpcut-release.jks
            echo "Release keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not available, fallback signing will be used."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Clean Release Assets
        run: |
          mkdir -p release_assets
          # Find and copy signed release apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-v1.5.1-release.apk
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-v1.5.1-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-release.apk
          fi
          # Copy debug apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-v1.5.1-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-debug.apk
          fi
          echo "Release assets ready:"
          ls -lh release_assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumpCut-Debug-APK
          path: release_assets/JumpCut-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JumpCut-Release-APK
          path: release_assets/JumpCut-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.5.1' }}
          name: "JumpCut AI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.5.1' }}"
          draft: false
          prerelease: false
          body: |
            ## 🚀 JumpCut AI v1.5.1 (Media3 Pipeline Fixes, Auto-Zoom Jumpcuts & Android 16 SAF)
            
            ### 🎬 What's New in v1.5.1:
            - **Fixed "Failed to load assets" (Media3 Asset Loader Error)**:
              - Clamped segment clipping boundaries strictly within total container duration, eliminating EOF crashes caused by word padding armor.
              - Allocated dedicated per-clip `MicroCrossfadeAudioProcessor` instances to prevent `IllegalStateException: Audio processor is already ended` across sequence boundaries.
              - Uniform video frame processing for Auto-Zoom Jumpcuts (1.0x identity on even cuts, 1.12x punch-ins on odd cuts) to preserve OpenGL context integrity.
              - Enabled hardware decoder fallback with detailed root-cause exception reporting.
            - **Android 16 Scoped Storage & SAF Folder Picker**:
              - Added direct **Save to Files / Choose Folder** using Storage Access Framework (`ActivityResultContracts.CreateDocument`).
              - Save directly to Downloads, SD Card, or any custom folder without `WRITE_EXTERNAL_STORAGE` permission.
              - External video player launcher support directly from the export completion screen.
            - **Export Bottom Sheet UX Improvements**:
              - Added `skipPartiallyExpanded` and smooth vertical scrolling.
              - Fully clickable setting card rows for effortless toggling on mobile touchscreens.
            
            ### 📱 Download & Install:
            - **`JumpCut-v1.5.1-release.apk`** / **`JumpCut-release.apk`** — Production Signed Release (Direct APK installer)
            - **`JumpCut-v1.5.1-debug.apk`** / **`JumpCut-debug.apk`** — Debug Build with extended developer logging
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
