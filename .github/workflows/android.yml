name: JumpCut Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JumpCut APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/jumpcut-release.jks
            echo "Release keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not available, fallback signing will be used."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Clean Release Assets
        run: |
          mkdir -p release_assets
          # Find and copy signed release apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-v1.1.0-release.apk
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-v1.1.0-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-release.apk
          fi
          # Copy debug apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-v1.1.0-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-debug.apk
          fi
          echo "Release assets ready:"
          ls -lh release_assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumpCut-Debug-APK
          path: release_assets/JumpCut-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JumpCut-Release-APK
          path: release_assets/JumpCut-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}
          name: "JumpCut AI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}"
          draft: false
          prerelease: false
          body: |
            ## 🚀 JumpCut AI v1.1.0 (Production Release)
            
            ### 🎨 What's New in v1.1.0:
            - **Studio Visual Redesign (No Purple)**: Redesigned with a deep obsidian & slate dark theme accented by Electric Cyan, Sapphire Blue, and Emerald Mint.
            - **Interactive Onboarding Walkthrough**: 4-step welcome guide explaining silence cutting, hardware passthrough, word padding armor, and segment editing.
            - **Persistent Project Library**: Past exports are automatically saved with thumbnails, duration pills, file sizes, in-app fullscreen replay, and 1-tap sharing.
            - **Granular Segment Inspector**: Creators can inspect all detected pauses on the timeline and toggle individual cuts (keep vs cut) with live duration calculation.
            - **Playback Speed Controls**: Quick 0.75x, 1.0x, 1.25x, 1.5x, and 2.0x chips to review long footage rapidly.
            - **Export Configuration Modal**: Switch between lossless Video (MP4) and Audio-Only (M4A extraction for podcasters), with direct save to Android Gallery (`Movies/JumpCut`).
            - **Storage Manager & Cache Cleaner**: Check cache usage in Settings and clean temp waveforms/downloads in 1 tap.
            
            ### 📱 Download & Install:
            - **`JumpCut-v1.1.0-release.apk`** / **`JumpCut-release.apk`** — Production Signed Release (Tap to install directly)
            - **`JumpCut-v1.1.0-debug.apk`** / **`JumpCut-debug.apk`** — Debug Build with extended developer logging
          files: |
            release_assets/JumpCut-v1.1.0-release.apk
            release_assets/JumpCut-v1.1.0-debug.apk
            release_assets/JumpCut-release.apk
            release_assets/JumpCut-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
