name: JumpCut Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JumpCut APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/jumpcut-release.jks
            echo "Release keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not available, fallback signing will be used."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Clean Release Assets
        run: |
          mkdir -p release_assets
          # Find and copy signed release apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-v1.5.0-release.apk
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-v1.5.0-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-release.apk
          fi
          # Copy debug apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-v1.5.0-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-debug.apk
          fi
          echo "Release assets ready:"
          ls -lh release_assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumpCut-Debug-APK
          path: release_assets/JumpCut-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JumpCut-Release-APK
          path: release_assets/JumpCut-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.5.0' }}
          name: "JumpCut AI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.5.0' }}"
          draft: false
          prerelease: false
          body: |
            ## 🚀 JumpCut AI v1.5.0 (Mobile NLE Studio & Google Play Billing Hardening)
            
            ### 🎬 What's New in v1.5.0:
            - **Pinned Mobile NLE Dual-Stage Layout**: Sticky upper monitor with 16:9 player, transport HUD (00:00 / 00:00 timecodes, 1.0x-2.0x playback speeds, Hold-for-Raw auditioning), and docked interactive waveform that never scrolls away.
            - **Precision Timecode Ruler**: Top-mounted timestamp ruler bar (`00:10`, `00:20`...) with major and minor tick subdivisions, visual cut (red) / keep (green) blocks, and draggable needle scrubber.
            - **3-Tab Modular Control Deck**:
              - **Tuning Tab**: Live speech floor impact HUD (`X cuts • -YY:ZZ`), decibel sensitivity slider, minimum silence length slider, and word padding armor.
              - **Presets Tab**: Rhythm profile bank (Viral Shorts, Podcast Studio, Fast Lecture, Vlog & Story) with custom preset creation.
              - **Pauses Tab**: Granular segment inspector listing exact millisecond durations with tap-to-seek and individual CUT/KEEP toggles.
            - **Creator Studio Bento Grid**: Obsidian slate dashboard with dynamic studio metrics (Time Saved, Pauses Cut, Lossless Passthrough) and 2x2 Quick Tools (Magic Auto-Cut, Voice Floor, EDL/XML Studio, Batch Splicer).
            - **Zero-Bypass Google Play Billing**: Hardened client-side billing integration requiring authentic Google Play Store receipt verification and session sanitization.
            - **Snapdragon 865 / Hardware Muxer Stabilization**: Robust muxer fallback pipeline preventing export crashes on Xiaomi Mi 10T and high-bitrate Android devices.
            
            ### 📱 Download & Install:
            - **`JumpCut-v1.5.0-release.apk`** / **`JumpCut-release.apk`** — Production Signed Release (Direct APK installer)
            - **`JumpCut-v1.5.0-debug.apk`** / **`JumpCut-debug.apk`** — Debug Build with extended developer logging
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
