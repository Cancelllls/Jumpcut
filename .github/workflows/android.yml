name: JumpCut Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JumpCut APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/jumpcut-release.jks
            echo "Release keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not available, fallback signing will be used."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Clean Release Assets
        run: |
          mkdir -p release_assets
          # Find and copy signed release apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-v1.5.5-release.apk
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-v1.5.5-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-release.apk
          fi
          # Copy debug apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-v1.5.5-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-debug.apk
          fi
          echo "Release assets ready:"
          ls -lh release_assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumpCut-Debug-APK
          path: release_assets/JumpCut-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JumpCut-Release-APK
          path: release_assets/JumpCut-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.5.5' }}
          name: "JumpCut AI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.5.5' }}"
          draft: false
          prerelease: false
          body: |
            ## 🎛️ JumpCut AI v1.5.5 (Studio Suite: SRT/VTT Subtitles, Silence Time-Warp 3×, Real-Time VU Meter & AI Auto-Calibrate)
            
            ### 💎 What's New in v1.5.5:
            - **Timed Subtitle Export (.SRT & .VTT)**:
              - Export millisecond-accurate speech cues (`.srt` / `.vtt`) with 1 tap directly from the Export sheet or project library cards.
              - Instant captioning and subtitle sync ready for CapCut, Premiere Pro, and DaVinci Resolve.
            - **Silence Time-Warp (3× Smooth Speed-Up vs. Hard Cut)**:
              - Instead of hard-cutting pauses, glide through silent gaps at 3× speed using Media3 `SpeedChangeEffect` and `SonicAudioProcessor`.
              - Live in-editor preview toggle (`Cut` vs `3× Warp`) with real-time playback speed adaptation.
            - **Real-Time Hardware VU Decibel Meter**:
              - Live dynamic dB peak meter calculating instantaneous energy with multi-color gradient bar, threshold needle, and reactive `VOICE` vs `CUT` telemetry tags.
            - **1-Tap AI Auto-Calibrate**:
              - Samples waveform energy percentiles (noise floor vs speech core) to automatically tune dB sensitivity and voice noise armor to the clip's acoustic environment.
            - **Encoding Screen WakeLock (`FLAG_KEEP_SCREEN_ON`)**:
              - Keeps hardware display awake and active during heavy MediaCodec rendering to guarantee zero Doze/background OS terminations.
            - **Tactile Studio Haptic Feedback**:
              - Integrated subtle tactile ticks across all sliders, speed selectors, tab switches, and export actions.
            - **Automated Engine Test Suite**:
              - Added comprehensive unit tests covering silence detection algorithms, EDL, FCPXML, SRT, and VTT timecode formatting.
            - **Modernized CI Workflow**:
              - Upgraded GitHub Actions to `actions/setup-java@v5` with automated release packaging.
            
            ### 📱 Download & Install:
            - **`JumpCut-v1.5.5-release.apk`** / **`JumpCut-release.apk`** — Production Signed Release (Direct APK installer)
            - **`JumpCut-v1.5.5-debug.apk`** / **`JumpCut-debug.apk`** — Debug Build with extended developer logging
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
