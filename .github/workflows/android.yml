name: JumpCut Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JumpCut APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/jumpcut-release.jks
            echo "Release keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not available, fallback signing will be used."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Clean Release Assets
        run: |
          mkdir -p release_assets
          # Find and copy signed release apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-v1.5.6-release.apk
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-v1.5.6-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-release.apk
          fi
          # Copy debug apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-v1.5.6-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-debug.apk
          fi
          echo "Release assets ready:"
          ls -lh release_assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumpCut-Debug-APK
          path: release_assets/JumpCut-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JumpCut-Release-APK
          path: release_assets/JumpCut-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.5.6' }}
          name: "JumpCut AI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.5.6' }}"
          draft: false
          prerelease: false
          body: |
            ## ✂️ JumpCut AI v1.5.6 (Pro Manual Editor & Social Suite)
            
            ### 🚀 What's New in v1.5.6:
            - **✂️ Pro Manual Editor Suite**:
              - **Razor Tool (Split at Playhead)**: 1-tap cut slicing the active segment at current cursor timecode into two independent segments with full undo history.
              - **Active Segment Inspector**: Dedicated HUD card showing Segment ID, timecode range, exact millisecond duration, and instant Voice/Cut toggle.
              - **Precision Boundary Nudges**: Fine-tune boundaries by `±100ms` or `±500ms` (`Start -0.1s / +0.1s`, `End -0.1s / +0.1s`) so dialogue never gets clipped.
              - **In / Out Work Area Trimming**: Set `[ Mark In` and `] Mark Out` points to isolate work areas or 1-tap cut all segments outside the work area range.
              - **Timeline Undo / Redo Stack**: 35-level LIFO history snapshot stack tracking cuts, splits, and parameter changes with tactile top-bar buttons.
              - **All Segments Mini-Navigator**: Rapid seek-and-toggle strip for all detected pauses and spoken blocks.
            - **📱 Multi-Format Social Aspect Ratio Suite**:
              - Social aspect ratio framing guide mask directly over video monitor (`9:16 Shorts / Reels / TikTok`, `1:1 Square`, `4:5 Portrait Feed`, `16:9 Landscape`).
              - Real-time pillarbox/letterbox safe framing guides and automated Media3 `Presentation.createForAspectRatio` cropping upon export.
            - **🔥 TikTok / Reels Burn-In Open Captions**:
              - Subtitles burned directly into MP4 frames via Media3 `TextOverlay` and `OverlayEffect`.
              - 3 creator graphic subtitle styles: Neon Cyan, Yellow Punch, and Classic White.
            - **⚡ Instant Lossless Remux Mode ("5-Second Export")**:
              - Direct bitstream video transmuxing via Media3 `Composition.setTransmuxVideo(true)` + keyframe alignment for instant exports when no video effects are applied.
            - **🎵 Background Music Bed with Auto-Ducking**:
              - Multi-track audio mixing in Media3 Transformer with `VolumeAudioProcessor` and automatic -14 dB speech ducking that glides music under dialogue.
            - **📦 Batch Video Ingest**:
              - Added 4-way hardware source rack on Home Screen with 10x batch multi-clip picker support.
            
            ### 📱 Download & Install:
            - **`JumpCut-v1.5.6-release.apk`** / **`JumpCut-release.apk`** — Production Signed Release (Direct APK installer)
            - **`JumpCut-v1.5.6-debug.apk`** / **`JumpCut-debug.apk`** — Debug Build with extended developer logging
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
