name: JumpCut Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build JumpCut APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/jumpcut-release.jks
            echo "Release keystore decoded successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not available, fallback signing will be used."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Clean Release Assets
        run: |
          mkdir -p release_assets
          # Find and copy signed release apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-v1.2.0-release.apk
            cp app/build/outputs/apk/release/app-release.apk release_assets/JumpCut-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-v1.2.0-release.apk
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_assets/JumpCut-release.apk
          fi
          # Copy debug apk
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-v1.2.0-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/JumpCut-debug.apk
          fi
          echo "Release assets ready:"
          ls -lh release_assets/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumpCut-Debug-APK
          path: release_assets/JumpCut-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JumpCut-Release-APK
          path: release_assets/JumpCut-release.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.0' }}
          name: "JumpCut AI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.2.0' }}"
          draft: false
          prerelease: false
          body: |
            ## 🚀 JumpCut AI v1.2.0 (Creator Studio Overhaul)
            
            ### 🎬 What's New in v1.2.0:
            - **Auto-Zoom Jumpcuts ("YouTuber / 2-Camera Pacing")**: Alternating subtle 1.12x punch-in zooms on consecutive speech cuts to create engaging talking-head retention dynamics for YouTube, Shorts, and TikTok.
            - **Professional Desktop NLE Bridge (.EDL / .XML Export)**: Creators can now export standard CMX 3600 Edit Decision Lists (`.edl`) and Final Cut Pro XML files directly from mobile into DaVinci Resolve or Adobe Premiere Pro with all individual cuts preserved.
            - **Multi-Scale Pinch & Zoom Waveform (1x, 2x, 4x)**: Zoom the audio timeline for sub-second precision inspection with smooth auto-centering playhead scrolling and tactile haptics.
            - **Custom Creator Profiles & Presets**: Save, name, and manage custom silence sensitivity, minimum pause length, and word padding presets (e.g. Studio Mic, Podcast, Walk & Talk).
            - **Lossless Hardware Splice Pipeline**: 100% on-device private processing with zero cloud uploads and near-instant render times.
            - **Zero Purple Cinematic Theme**: Deep Obsidian `#0B0F17` & Slate `#111827` surface with Electric Cyan & Sapphire Blue accents.
            
            ### 📱 Download & Install:
            - **`JumpCut-v1.2.0-release.apk`** / **`JumpCut-release.apk`** — Production Signed Release (Direct APK installer)
            - **`JumpCut-v1.2.0-debug.apk`** / **`JumpCut-debug.apk`** — Debug Build with extended developer logging
          files: |
            release_assets/JumpCut-v1.2.0-release.apk
            release_assets/JumpCut-v1.2.0-debug.apk
            release_assets/JumpCut-release.apk
            release_assets/JumpCut-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
